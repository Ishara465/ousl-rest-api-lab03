
name: AWS DevSecOps Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ousl-project

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: SonarCloud SAST Scan
      - name: SonarCloud SAST Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn verify sonar:sonar \
            -Dsonar.projectKey=ousl-student-service \
            -Dsonar.qualitygate.wait=true

      # Step 4: Build Docker Container
      - name: Build Container
        run: docker build -t ousl-student-api:${{ github.sha }} .

      # Step 5: Aqua Security Trivy Scan
      - name: Aqua Security Trivy Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: 'ousl-student-api:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL'

      # Step 6: Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2
